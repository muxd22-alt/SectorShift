<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PWA Standalone App</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css">
    
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PWA App">

    <!-- Preact + HTM from CDN -->
    <script src="https://unpkg.com/preact@10.22.1/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.22.1/hooks/dist/hooks.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="https://unpkg.com/@preact/signals-core@1.6.1/dist/signals-core.min.js"></script>
    <script src="https://unpkg.com/@preact/signals@1.3.0/dist/signals.min.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.error('Service Worker error', err));
        }
    </script>
</head>
<body>
    <div id="app"></div>
    <!-- App Version -->
    <script src="./js/version.js"></script>
    <!-- App Logic -->
    <script type="module" src="./app.js"></script>
</body>
</html>
