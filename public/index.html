<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SectorShift | Strategic Intelligence Engine</title>
    <meta name="description" content="AI-powered dashboard for analyzing breakthrough academic research and market news.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="dashboard">
        <header class="glass-panel">
            <div class="header-content">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    <h1>Sector<span>Shift</span></h1>
                </div>
                <p class="tagline">محرك الذكاء الاستراتيجي</p>
            </div>
            
            <div class="controls">
                <div class="filter-group">
                    <label for="filter-type">المصدر</label>
                    <select id="filter-type">
                        <option value="all">كل المصادر</option>
                        <option value="papers">الأوراق البحثية</option>
                        <option value="news">أخبار السوق</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-score">أهمية الأبحاث</label>
                    <select id="filter-score">
                        <option value="all">الكل</option>
                        <option value="7" selected>7+ (مرتفع)</option>
                        <option value="8">8+ (مهم جداً)</option>
                        <option value="9">9+ (ثوري)</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filter-tag">التصنيف</label>
                    <select id="filter-tag">
                        <option value="all">جميع التصنيفات</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filter-sector">القطاع المستهدف</label>
                    <select id="filter-sector">
                        <option value="all">جميع القطاعات</option>
                    </select>
                </div>
            </div>
        </header>

        <section id="executive-summary" class="glass-panel summary-panel" style="display: none;">
            <div class="summary-header">
                <h2>📊 الملخص التنفيذي اليومي</h2>
            </div>
            <div class="summary-body">
                <div class="summary-column">
                    <h3 class="benefiting-title">📈 القطاعات والشركات المستفيدة</h3>
                    <div id="summary-benefiting" class="tags-container"></div>
                </div>
                <div class="summary-column">
                    <h3 class="disrupted-title">⚠️ القطاعات والشركات المتضررة</h3>
                    <div id="summary-disrupted" class="tags-container"></div>
                </div>
            </div>
        </section>

        <section id="results-grid" class="results-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Synthesizing Intelligence...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
